name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Obsidian Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify translations
        run: npm run i18n:verify

      - name: Build
        run: npm run build

      - name: Validate release metadata
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));

          const failures = [];
          const semverPattern = /^\d+\.\d+\.\d+$/u;

          if (!semverPattern.test(manifest.version)) {
            failures.push(`manifest version must use x.y.z: ${manifest.version}`);
          }

          if (packageJson.version !== manifest.version) {
            failures.push(
              `package.json version ${packageJson.version} does not match manifest ${manifest.version}`,
            );
          }

          if (packageLock.version !== manifest.version) {
            failures.push(
              `package-lock.json version ${packageLock.version} does not match manifest ${manifest.version}`,
            );
          }

          if (packageLock.packages?.[""]?.version !== manifest.version) {
            failures.push(
              `package-lock root package version ${packageLock.packages?.[""]?.version} does not match manifest ${manifest.version}`,
            );
          }

          if (versions[manifest.version] !== manifest.minAppVersion) {
            failures.push(
              `versions.json must map ${manifest.version} to ${manifest.minAppVersion}`,
            );
          }

          if (manifest.id.includes("obsidian")) {
            failures.push("manifest id must not include 'obsidian'");
          }

          for (const file of ["main.js", "manifest.json", "styles.css"]) {
            if (!fs.existsSync(file)) {
              failures.push(`missing release asset: ${file}`);
              continue;
            }

            const stats = fs.statSync(file);
            if (stats.size === 0) {
              failures.push(`release asset is empty: ${file}`);
            }
          }

          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Generate artifact attestations
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload Obsidian plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: canvas-bases-${{ github.sha }}
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

  publish-release:
    name: Publish Obsidian Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Obsidian plugin assets
        uses: actions/download-artifact@v4
        with:
          name: canvas-bases-${{ github.sha }}
          path: release-assets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -e "const fs = require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync('release-assets/manifest.json', 'utf8')).version);")"

          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag '$TAG' must match manifest version '$VERSION'."
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(
            "release-assets/main.js"
            "release-assets/manifest.json"
            "release-assets/styles.css"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "See CHANGELOG.md for release notes."
          fi
